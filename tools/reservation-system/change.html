<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約変更</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  background: #f5f7fa;
  color: #333;
  line-height: 1.6;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  text-align: center;
  padding: 20px 16px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
}

.header h1 { font-size: 20px; letter-spacing: 2px; margin-bottom: 4px; }
.header p { font-size: 13px; opacity: 0.85; }

.screen { display: none; }
.screen.active { display: block; }

.card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  margin-bottom: 16px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #555;
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
  -webkit-appearance: none;
  appearance: none;
  background: #fff;
}

.form-group input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
}

.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: opacity 0.2s;
  letter-spacing: 1px;
}

.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
}

.btn-success {
  background: #28a745;
  color: #fff;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  color: #667eea;
  font-size: 14px;
  cursor: pointer;
  padding: 8px 0;
  margin-bottom: 12px;
}

.back-btn:hover { text-decoration: underline; }

/* 予約情報表示 */
.reservation-info {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 20px;
}

.reservation-info .info-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
  font-size: 14px;
}

.reservation-info .info-row:last-child { border-bottom: none; }
.reservation-info .info-label { color: #888; }
.reservation-info .info-value { font-weight: 500; }

/* カレンダー */
.calendar-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.calendar-nav button {
  background: #667eea;
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 14px;
  cursor: pointer;
}

.calendar-nav button:hover { background: #5a6fd6; }

.calendar-nav .month-label {
  font-size: 18px;
  font-weight: bold;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 16px;
}

.calendar-grid .day-header {
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: #888;
  padding: 8px 0;
}

.calendar-grid .day-header:first-child { color: #e74c3c; }
.calendar-grid .day-header:last-child { color: #3498db; }

.calendar-cell {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 14px;
  cursor: default;
  transition: all 0.2s;
  border: 1px solid transparent;
}

.calendar-cell.empty { background: transparent; }
.calendar-cell.available { background: #fff; border: 1px solid #e0e0e0; cursor: pointer; }
.calendar-cell.available:hover { background: #f0f0ff; border-color: #667eea; transform: scale(1.05); }
.calendar-cell.full { background: #e9ecef; color: #999; }
.calendar-cell.full::after { content: '×'; font-size: 10px; color: #cc0000; }
.calendar-cell.closed { background: #fff0f0; color: #cc9999; }
.calendar-cell.closed::after { content: '休'; font-size: 10px; color: #cc0000; }
.calendar-cell.past { background: #f5f5f5; color: #ccc; }

/* 時間枠 */
.time-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}

.time-slot {
  padding: 14px 8px;
  text-align: center;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.time-slot.available { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
.time-slot.available:hover { background: #28a745; color: #fff; transform: scale(1.03); }
.time-slot.unavailable { background: #e9ecef; color: #999; cursor: default; border: 2px solid #e9ecef; }

.selected-date-label {
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 16px;
  padding: 12px;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

/* 変更確認 */
.change-comparison {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 20px;
}

.change-box {
  background: #f8f9fa;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}

.change-box.old { border-left: 4px solid #e74c3c; }
.change-box.new { border-left: 4px solid #28a745; }
.change-box .label { font-size: 12px; color: #888; margin-bottom: 4px; }
.change-box .value { font-size: 15px; font-weight: bold; }

.change-arrow {
  font-size: 24px;
  color: #667eea;
  text-align: center;
}

/* 完了 */
.complete-msg {
  text-align: center;
  padding: 40px 20px;
}

.complete-msg h2 { font-size: 20px; color: #28a745; margin-bottom: 12px; }
.complete-msg p { color: #666; font-size: 14px; margin-bottom: 8px; }

/* ローディング */
.loading-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.85);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.loading-overlay.active { display: flex; }

.spinner {
  width: 40px; height: 40px;
  border: 4px solid #e0e0e0;
  border-top: 4px solid #667eea;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.loading-text { margin-top: 12px; color: #667eea; font-size: 14px; }

.page-links {
  text-align: center;
  margin-top: 20px;
  font-size: 13px;
}

.page-links a { color: #667eea; text-decoration: none; margin: 0 8px; }
.page-links a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">処理中...</div>
</div>

<div class="container">
  <div class="header">
    <h1>予約変更</h1>
    <p>予約日時の変更はこちらから</p>
  </div>

  <!-- 画面1：検索 -->
  <div class="screen active" id="screen-search">
    <div class="card">
      <div class="form-group">
        <label>予約ID</label>
        <input type="text" id="inputReservationId" placeholder="例：RSV-20260401-001">
      </div>
      <div class="form-group">
        <label>氏名</label>
        <input type="text" id="inputName" placeholder="例：山田 太郎">
      </div>
      <button class="btn btn-primary" onclick="searchReservation()">予約を検索する</button>
    </div>
  </div>

  <!-- 画面2：現在の予約表示＋日付選択 -->
  <div class="screen" id="screen-calendar">
    <button class="back-btn" onclick="showScreen('search')">&#9664; 検索に戻る</button>

    <div class="card" style="margin-bottom:16px;">
      <h3 style="font-size:15px;margin-bottom:12px;">現在の予約内容</h3>
      <div class="reservation-info" id="currentReservationInfo"></div>
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:16px;">新しい日付を選択</h3>
      <div class="calendar-nav">
        <button onclick="changeMonth(-1)">&#9664; 前月</button>
        <span class="month-label" id="monthLabel"></span>
        <button onclick="changeMonth(1)">次月 &#9654;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <!-- 画面3：時間枠選択 -->
  <div class="screen" id="screen-time">
    <button class="back-btn" onclick="showScreen('calendar')">&#9664; 日付に戻る</button>
    <div class="selected-date-label" id="selectedDateLabel"></div>
    <div class="time-grid" id="timeGrid"></div>
  </div>

  <!-- 画面4：変更確認 -->
  <div class="screen" id="screen-confirm">
    <button class="back-btn" onclick="showScreen('time')">&#9664; 時間に戻る</button>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:16px;">変更内容の確認</h3>

      <div class="change-comparison">
        <div class="change-box old">
          <div class="label">変更前</div>
          <div class="value" id="oldDateTime"></div>
        </div>
        <div class="change-arrow">→</div>
        <div class="change-box new">
          <div class="label">変更後</div>
          <div class="value" id="newDateTime"></div>
        </div>
      </div>

      <div class="reservation-info" id="confirmReservationInfo"></div>

      <button class="btn btn-success" id="changeBtn" onclick="confirmChange()">この内容で変更する</button>
      <div style="text-align:center;margin-top:12px;">
        <a href="javascript:void(0)" onclick="showScreen('calendar')" style="color:#667eea;font-size:14px;">やり直す</a>
      </div>
    </div>
  </div>

  <!-- 画面5：完了 -->
  <div class="screen" id="screen-complete">
    <div class="card">
      <div class="complete-msg">
        <h2>予約変更が完了しました</h2>
        <p id="changeCompleteMsg"></p>
        <p>変更確認メールをお送りしました。</p>
      </div>
    </div>
  </div>

  <div class="page-links">
    <a href="?page=index">新規予約</a> |
    <a href="?page=cancel">予約キャンセル</a>
  </div>
</div>

<script>
var webAppUrl = window.location.href.split('?')[0];
var reservationData = null;
var currentYear, currentMonth;
var newSelectedDate = '';
var newSelectedTime = '';

function postData(params) {
  return new Promise(function(resolve, reject) {
    fetch(webAppUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
      if (result.success) resolve(result.data);
      else reject(result.error || '不明なエラー');
    })
    .catch(function(err) { reject('通信エラー: ' + err.message); });
  });
}

function showLoading(text) {
  var overlay = document.getElementById('loading');
  overlay.querySelector('.loading-text').textContent = text || '処理中...';
  overlay.classList.add('active');
}

function hideLoading() {
  document.getElementById('loading').classList.remove('active');
}

function showScreen(name) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

// ============================================================
// 画面1：検索
// ============================================================
function searchReservation() {
  var reservationId = document.getElementById('inputReservationId').value.trim();
  var name = document.getElementById('inputName').value.trim();

  if (!reservationId || !name) {
    alert('予約IDと氏名を入力してください。');
    return;
  }

  showLoading('予約を検索中...');

  postData({
    action: 'findReservation',
    reservationId: reservationId,
    name: name
  }).then(function(data) {
    hideLoading();
    reservationData = data;

    if (data.status === 'キャンセル') {
      alert('キャンセル済みの予約は変更できません。');
      return;
    }

    // 現在の予約情報を表示
    var infoHtml =
      '<div class="info-row"><span class="info-label">予約ID</span><span class="info-value">' + data.reservationId + '</span></div>' +
      '<div class="info-row"><span class="info-label">予約日</span><span class="info-value">' + data.date + '</span></div>' +
      '<div class="info-row"><span class="info-label">予約時間</span><span class="info-value">' + data.time + '</span></div>' +
      '<div class="info-row"><span class="info-label">メニュー</span><span class="info-value">' + data.menuName + '</span></div>' +
      '<div class="info-row"><span class="info-label">料金</span><span class="info-value">¥' + Number(data.price).toLocaleString() + '</span></div>';

    document.getElementById('currentReservationInfo').innerHTML = infoHtml;

    // カレンダー初期化
    var now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;
    loadCalendar();

    showScreen('calendar');
  }).catch(function(err) {
    hideLoading();
    alert(err);
  });
}

// ============================================================
// 画面2：カレンダー
// ============================================================
function loadCalendar() {
  showLoading('カレンダーを読み込み中...');
  document.getElementById('monthLabel').textContent = currentYear + '年' + currentMonth + '月';

  postData({
    action: 'getCalendarData',
    year: currentYear,
    month: currentMonth
  }).then(function(days) {
    hideLoading();
    renderCalendar(days);
  }).catch(function(err) {
    hideLoading();
    alert('カレンダーの読み込みに失敗しました: ' + err);
  });
}

function renderCalendar(days) {
  var grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  var dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  for (var h = 0; h < 7; h++) {
    var header = document.createElement('div');
    header.className = 'day-header';
    header.textContent = dayNames[h];
    grid.appendChild(header);
  }

  var firstDate = new Date(currentYear, currentMonth - 1, 1);
  var startDay = firstDate.getDay();
  for (var e = 0; e < startDay; e++) {
    var emptyCell = document.createElement('div');
    emptyCell.className = 'calendar-cell empty';
    grid.appendChild(emptyCell);
  }

  for (var i = 0; i < days.length; i++) {
    var dayData = days[i];
    var cell = document.createElement('div');
    cell.className = 'calendar-cell ' + dayData.status;

    var numberSpan = document.createElement('span');
    numberSpan.textContent = dayData.day;
    cell.appendChild(numberSpan);

    if (dayData.status === 'available') {
      (function(dateStr) {
        cell.onclick = function() { selectNewDate(dateStr); };
      })(dayData.date);
    }

    grid.appendChild(cell);
  }
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth < 1) { currentMonth = 12; currentYear--; }
  else if (currentMonth > 12) { currentMonth = 1; currentYear++; }
  loadCalendar();
}

// ============================================================
// 画面3：時間枠選択
// ============================================================
function selectNewDate(dateStr) {
  newSelectedDate = dateStr;

  var parts = dateStr.split('-');
  var dayNames = ['日', '月', '火', '水', '木', '金', '土'];
  var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
  var label = parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日（' + dayNames[d.getDay()] + '）';
  document.getElementById('selectedDateLabel').textContent = label;

  showScreen('time');

  showLoading('空き時間を確認中...');
  postData({
    action: 'getAvailableSlots',
    date: dateStr
  }).then(function(slots) {
    hideLoading();
    renderTimeSlots(slots);
  }).catch(function(err) {
    hideLoading();
    alert('時間枠の読み込みに失敗しました: ' + err);
  });
}

function renderTimeSlots(slots) {
  var grid = document.getElementById('timeGrid');
  grid.innerHTML = '';

  for (var i = 0; i < slots.length; i++) {
    var slot = slots[i];
    var btn = document.createElement('div');
    btn.className = 'time-slot ' + (slot.available ? 'available' : 'unavailable');
    btn.textContent = slot.time;

    if (slot.available) {
      (function(time) {
        btn.onclick = function() { selectNewTime(time); };
      })(slot.time);
    }

    grid.appendChild(btn);
  }

  if (slots.length === 0) {
    grid.innerHTML = '<p style="text-align:center;color:#999;grid-column:1/-1;padding:20px;">空き時間がありません</p>';
  }
}

// ============================================================
// 画面4：変更確認
// ============================================================
function selectNewTime(time) {
  newSelectedTime = time;

  // 変更前後の比較を表示
  document.getElementById('oldDateTime').textContent =
    reservationData.date + ' ' + reservationData.time;
  document.getElementById('newDateTime').textContent =
    newSelectedDate + ' ' + newSelectedTime;

  var infoHtml =
    '<div class="info-row"><span class="info-label">予約ID</span><span class="info-value">' + reservationData.reservationId + '</span></div>' +
    '<div class="info-row"><span class="info-label">氏名</span><span class="info-value">' + reservationData.name + '</span></div>' +
    '<div class="info-row"><span class="info-label">メニュー</span><span class="info-value">' + reservationData.menuName + '</span></div>' +
    '<div class="info-row"><span class="info-label">料金</span><span class="info-value">¥' + Number(reservationData.price).toLocaleString() + '</span></div>';

  document.getElementById('confirmReservationInfo').innerHTML = infoHtml;

  showScreen('confirm');
}

function confirmChange() {
  var btn = document.getElementById('changeBtn');
  btn.disabled = true;
  showLoading('変更処理中...');

  postData({
    action: 'changeReservation',
    reservationId: reservationData.reservationId,
    newDate: newSelectedDate,
    newTime: newSelectedTime
  }).then(function(result) {
    hideLoading();
    btn.disabled = false;

    document.getElementById('changeCompleteMsg').textContent =
      result.oldDate + ' ' + result.oldTime + ' → ' +
      result.newDate + ' ' + result.newTime + ' に変更しました。';

    showScreen('complete');
  }).catch(function(err) {
    hideLoading();
    btn.disabled = false;
    alert('変更に失敗しました: ' + err);
  });
}
</script>
</body>
</html>
